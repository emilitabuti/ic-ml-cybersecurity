# BMM Module Configuration — TEMPLATE
# ─────────────────────────────────────────────────────────────
# Repositório compartilhado: cada colaboradora possui sua config pessoal.
#
# COMO USAR:
#   1. Copie este arquivo para config.yaml (mesma pasta)
#   2. Substitua {seu-nome} pelo seu nome em minúsculas (emili | isabela | caroline)
